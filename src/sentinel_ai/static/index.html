<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Sentinel AI · Security Operations</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <div id="auth-screen" class="auth-screen" hidden></div>
  <div id="app-shell" class="app-shell" hidden>
    <aside class="sidebar" aria-label="Main navigation">
      <a class="brand" href="#overview" aria-label="Sentinel AI Overview">
        <span class="brand-mark"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2 28 7v8c0 7.4-4.8 12.5-12 15C8.8 27.5 4 22.4 4 15V7l12-5Z"/><path d="m10.5 15.5 3.6 3.6 7.7-8"/></svg></span>
        <span><strong>sentinel<span>.ai</span></strong><small>SECURITY OPERATIONS</small></span>
      </a>
      <div class="workspace-label">WORKSPACE <span class="workspace-dot"></span><span id="org-name">LOCAL</span></div>
      <nav id="main-nav" class="main-nav">
        <button class="nav-item active" data-view="overview"><span class="nav-icon">◫</span>Overview</button>
        <button class="nav-item" data-view="new"><span class="nav-icon">＋</span>New Assessment</button>
        <button class="nav-item" data-view="live"><span class="nav-icon">◎</span>Live Browser</button>
        <button class="nav-item" data-view="history"><span class="nav-icon">◷</span>Scan History</button>
        <button class="nav-item" data-view="findings"><span class="nav-icon">⌁</span>Vulnerabilities</button>
        <button class="nav-item" data-view="reports"><span class="nav-icon">▤</span>Reports</button>
        <button class="nav-item" data-view="targets"><span class="nav-icon">⌖</span>Authorized Targets</button>
        <div class="nav-divider"></div>
        <button class="nav-item" data-view="agent"><span class="nav-icon">✳</span>Agent Configuration</button>
        <button class="nav-item" data-view="settings"><span class="nav-icon">⚙</span>Settings</button>
        <button class="nav-item" data-view="audit"><span class="nav-icon">≡</span>Audit Logs</button>
      </nav>
      <div class="sidebar-bottom">
        <div class="local-card"><span class="local-lock">⌑</span><div><strong>Local workspace</strong><small>Bound to this computer</small></div><span class="status-dot good"></span></div>
        <div class="profile-row"><span class="avatar" id="profile-initial">M</span><span class="profile-name"><strong id="profile-email">Owner</strong><small>Workspace owner</small></span><button id="logout-btn" class="icon-button" title="Sign out" aria-label="Sign out">↗</button></div>
      </div>
    </aside>
    <main class="main-area">
      <header class="topbar">
        <div class="breadcrumb"><span>Workspace</span><span class="crumb-sep">/</span><strong id="page-label">Overview</strong></div>
        <div class="topbar-actions"><span class="topbar-worker"><span id="top-worker-dot" class="status-dot"></span><span id="top-worker-text">Worker checking</span></span><span class="topbar-divider"></span><button class="help-button" id="refresh-btn" title="Refresh data" aria-label="Refresh">↻</button><span id="top-date" class="date-text"></span></div>
      </header>
      <section id="view" class="view" aria-live="polite"></section>
      <div id="toast-region" class="toast-region" aria-live="polite"></div>
    </main>
  </div>
</body>
</html>
